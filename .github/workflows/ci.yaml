name: CI
on:
    push:
    pull_request:
    workflow_dispatch:
    #schedule:
    #    - cron: '42 5 * * 0'
jobs:
  compose:
      runs-on: ubuntu-latest
      steps:
      - name: Set up docker compose
        uses: docker/setup-compose-action@v1
  perl-job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version:
#          - '5.8'
#          - '5.30'
          - '5.42'
#          - 'latest'
    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}     # https://hub.docker.com/r/perldocker/perl-tester
    name: Perl ${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis Services
        run: |
            docker-compose -f t/docker-compose.test.yml up --exit-code-from tester --abort-on-container-exit
      
      - name: Prepare for release tests
        run: |
            cpanm --installdep .
            cpanm --notest Test::CheckManifest Test::Pod::Coverage Pod::Coverage Test::Pod
            
      - name: Release tests
        env:
          RELEASE_TESTING: 1
          REDIS_HOST: redis
          REDIS_AUTH: redis-auth
        run: |
            perl Makefile.PL
            make
            make test
